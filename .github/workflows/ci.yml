name: CI / CD Verification Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-verify:
    name: Typecheck, Unit & E2E Testing
    runs-on: ubuntu-latest

    env:
      BETTER_AUTH_SECRET: ci-secret-key-for-testing-purposes-only-32chars
      BETTER_AUTH_URL: http://localhost:3000
      STORAGE_PROVIDER: local
      CACHE_PROVIDER: memory

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 3. Install NPM Dependencies
        run: npm ci

      - name: 4. TypeScript Typecheck
        run: npx tsc --noEmit

      - name: 5. Run Vitest Unit & Integration Tests
        run: npm test

      - name: 6. Build Next.js Production Bundle
        run: npm run build

      - name: 7. Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: 8. Run Playwright End-to-End Tests
        run: npx playwright test --project=chromium --workers=1
        env:
          CI: true

      - name: 9. Upload Playwright Test Report (on failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
